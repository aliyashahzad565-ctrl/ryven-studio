<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore RYVEN Studios cinematic 3D character worlds.">
    <title>RYVEN Studios - Cinematic Worlds</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/heading-fix.css">
</head>
<body class="cinematics-gallery-page">
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="RYVEN Studios Home"><img src="./assets/images/ryven-bird-gradient.png" alt=""><span class="logo-type"><strong>RYVEN</strong><small>STUDIOS</small></span></a>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-cta">
            <a href="contact.html" class="btn-primary">Start A Project</a>
        </div>
    </header>

    <main>
        <section class="hover-gallery-section cinematic-gallery is-visible" id="hoverGallery">
            <div class="cinematic-gallery__eyebrow">RYVEN STUDIOS / SELECTED 3D WORLDS</div>
            <div class="hover-gallery__title" aria-hidden="true">
                <h1 data-accent-length="9">Cinematic Animation</h1>
                <p>Characters, creatures and impossible worlds shaped frame by frame.</p>
            </div>

            <div class="hover-gallery__stage" id="hoverGalleryStage"
                 aria-label="Continuously rotating gallery of cinematic 3D artwork">
                <div class="hover-gallery__ring" id="hoverGalleryRing">
                    <article class="hover-gallery__panel" style="--i:0">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-01.webp" alt="Ember Sentinel cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-01.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:1">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-02.webp" alt="Neon Warrior cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-02.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:2">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-03.webp" alt="Mechanical Guardian cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-03.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:3">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-04.webp" alt="Arcane Guardian cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-04.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:4">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-05.webp" alt="Chrome Hunter cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-05.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:5">
                        <img class="hover-gallery__front" src="./assets/images/gallery/gaming-06.webp" alt="Iron Warden cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/gaming-06.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:6">
                        <img class="hover-gallery__front" src="./assets/images/gallery/character-01.webp" alt="Dune Monarch cinematic 3D character" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/character-01.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                    <article class="hover-gallery__panel" style="--i:7">
                        <img class="hover-gallery__front" src="./assets/images/gallery/character-04.webp" alt="Void Ranger cinematic 3D creature" loading="eager" decoding="async">
                        <img class="hover-gallery__back" src="./assets/images/gallery/character-04.webp" alt="" aria-hidden="true" loading="eager" decoding="async">
                    </article>
                </div>
            </div>

            <div class="cinematic-gallery__hint">HOVER AN IMAGE TO PAUSE &nbsp;•&nbsp; CLICK TO VIEW</div>
        </section>
    </main>

    <script src="./assets/js/main.js"></script>
</body>
</html>
